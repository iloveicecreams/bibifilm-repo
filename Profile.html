<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiBiFilm — Профиль</title>
  <link rel="icon" type="image/png" href="assets/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- Sidebar -->
    <nav class="sidebar" role="navigation" aria-label="Главная навигация">
      <a href="index.html" class="sidebar__logo" aria-label="BiBiFilm — главная">
        <img src="assets/icons/icon.png" alt="" loading="lazy">
      </a>

      <div class="sidebar__nav">
        <a href="index.html" class="nav-item" title="Главная" aria-label="Главная">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>

        <a href="#" class="nav-item" title="Категории" aria-label="Категории">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15c0-1.66 1.34-3 3-3s3 1.34 3 3-3-1.34-3-3z"/></svg>
        </a>

        <a href="#" class="nav-item" title="Моя библиотека" aria-label="Моя библиотека">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v14zM8 15c0-1.66 1.34-3 3-3s3 1.34 3 3-3-1.34-3-3z"/></svg>
        </a>

        <a href="Register.html" class="nav-item" id="authNavLink" title="Войти / Регистрация" aria-label="Войти или зарегистрироваться">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </a>

        <a href="#" class="nav-item" id="logoutNavLink" title="Выйти" aria-label="Выйти из аккаунта" style="display: none;" onclick="logout()">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </a>
      </div>

      <div class="sidebar__user">
        <a href="Profile.html" class="user-avatar" id="sidebarAvatar" title="Профиль" aria-label="Профиль">Б</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <div class="container">
        <!-- Profile Header -->
        <header class="profile-header" role="banner">
          <div class="profile-avatar" id="profileAvatar">Б</div>
          <div class="profile-info">
            <div class="profile-name-row">
              <h1 class="profile-name" id="userName">Биби</h1>
              <span class="badge" style="background: var(--color-surface); color: var(--color-text-muted); border: 1px solid var(--color-border);">User</span>
            </div>
            <div class="profile-handle" id="userHandle">@1</div>
            <div class="profile-status">Участник с <span id="memberSince">2026</span></div>
          </div>
          <button class="btn btn--secondary" id="logoutBtn" aria-label="Выйти из аккаунта">Выйти</button>
        </header>

        <!-- Continue Watching (from history) -->
        <section class="section" id="continueSection" aria-labelledby="continue-title" style="display: none;">
          <div class="section__header">
            <h2 class="section__title" id="continue-title">Продолжить просмотр</h2>
          </div>
          <div class="rail-wrapper">
            <button class="rail-nav rail-nav--prev" aria-label="Назад" onclick="scrollRail('continueRail', -1)" title="Назад">
              <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="rail" id="continueRail" role="list"></div>
            <button class="rail-nav rail-nav--next" aria-label="Вперёд" onclick="scrollRail('continueRail', 1)" title="Вперёд">
              <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
          </div>
        </section>

        <!-- Favorites / Saved -->
        <section class="section" id="favoritesSection" aria-labelledby="favorites-title">
          <div class="section__header">
            <h2 class="section__title" id="favorites-title">Сохранённое</h2>
          </div>
          <div class="rail-wrapper">
            <button class="rail-nav rail-nav--prev" aria-label="Назад" onclick="scrollRail('favoritesRail', -1)" title="Назад">
              <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="rail" id="favoritesRail" role="list"></div>
            <button class="rail-nav rail-nav--next" aria-label="Вперёд" onclick="scrollRail('favoritesRail', 1)" title="Вперёд">
              <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
          </div>
        </section>

        <!-- Account Actions -->
        <section class="section" aria-labelledby="account-title">
          <h2 class="section__title" id="account-title">Аккаунт</h2>
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
            <article class="setting-card" onclick="changeName()">
              <div class="setting-card__header">
                <div class="setting-card__icon">
                  <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><path d="M12 17h.01"/></svg>
                </div>
                <h3 class="setting-card__title">Имя профиля</h3>
              </div>
              <p class="setting-card__desc">Изменить отображаемое имя</p>
            </article>

            <article class="setting-card" onclick="changePassword()">
              <div class="setting-card__header">
                <div class="setting-card__icon">
                  <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h3 class="setting-card__title">Пароль</h3>
              </div>
              <p class="setting-card__desc">Сменить пароль</p>
            </article>

            <article class="setting-card" style="border-color: var(--color-danger-muted);" onclick="logout()">
              <div class="setting-card__header">
                <div class="setting-card__icon" style="background: var(--color-danger-muted); color: var(--color-danger);">
                  <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17L21 12M16 7L21 12M21 12H9"/></svg>
                </div>
                <h3 class="setting-card__title" style="color: var(--color-danger);">Выйти из аккаунта</h3>
              </div>
              <p class="setting-card__desc">Завершить сессию на этом устройстве</p>
            </article>
          </div>
        </section>

        <!-- Stats -->
        <section class="section" aria-labelledby="stats-title">
          <h2 class="section__title" id="stats-title">Статистика</h2>
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-3);">
            <article class="setting-card" style="text-align: center; padding: var(--space-6);">
              <div style="font-size: var(--text-3xl); font-weight: var(--font-extrabold); color: var(--color-brand);" id="statFilms">0</div>
              <div style="font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1);">Просмотрено видео</div>
            </article>
            <article class="setting-card" style="text-align: center; padding: var(--space-6);">
              <div style="font-size: var(--text-3xl); font-weight: var(--font-extrabold); color: var(--color-brand);" id="statTime">0 мин</div>
              <div style="font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1);">Времени просмотра</div>
            </article>
            <article class="setting-card" style="text-align: center; padding: var(--space-6);">
              <div style="font-size: var(--text-3xl); font-weight: var(--font-extrabold); color: var(--color-brand);" id="statSaved">0</div>
              <div style="font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1);">Сохранено</div>
            </article>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- Video Player Modal -->
  <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-label="Видеоплеер" onclick="closePlayer()">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <button class="modal__close" onclick="closePlayer()" aria-label="Закрыть плеер">×</button>
      <video class="modal__video" id="mainPlayer" controls playsinline></video>
    </div>
  </div>

  <!-- Simple Modal for name/password change -->
  <div class="modal" id="actionModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="closeModal()">
    <div class="modal__backdrop"></div>
    <div class="modal__content" style="max-width: 420px; aspect-ratio: auto; padding: var(--space-6);" onclick="event.stopPropagation()">
      <h3 id="modalTitle" style="font-size: var(--text-xl); font-weight: var(--font-bold); margin-bottom: var(--space-5);"></h3>
      <form id="modalForm">
        <div class="form-group" id="modalNameGroup">
          <label class="form-label" for="modalNameInput">Новое имя</label>
          <input type="text" id="modalNameInput" class="form-input" placeholder="Введите имя" maxlength="20">
        </div>
        <div class="form-group" id="modalPassGroup" style="display: none;">
          <label class="form-label" for="modalCurrentPass">Текущий пароль</label>
          <input type="password" id="modalCurrentPass" class="form-input" placeholder="Введите текущий пароль">
        </div>
        <div class="form-group" id="modalNewPassGroup" style="display: none;">
          <label class="form-label" for="modalNewPass">Новый пароль</label>
          <input type="password" id="modalNewPass" class="form-input" placeholder="Минимум 4 символа" minlength="4">
        </div>
        <div class="form-group" id="modalConfirmPassGroup" style="display: none;">
          <label class="form-label" for="modalConfirmPass">Подтвердите новый пароль</label>
          <input type="password" id="modalConfirmPass" class="form-input" placeholder="Повторите новый пароль">
        </div>
        <div style="display: flex; gap: var(--space-3); margin-top: var(--space-6);">
          <button type="button" class="btn btn--secondary flex-1" onclick="closeModal()">Отмена</button>
          <button type="submit" class="btn btn--primary flex-1" id="modalSubmitBtn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Data & App Scripts -->
  <script>
    // ==========================================
    // BiBiFilm — CONFIG (EDIT HERE)
    // ==========================================
    // ═══════════════════════════════════════════
    // ПУТИ К АССЕТАМ (меняй если переместил папки)
    // ═══════════════════════════════════════════
    const VIDEOS = 'assets/videos/';
    const PHOTOS = 'assets/photos/';

    // ═══════════════════════════════════════════
    // ГЛАВНЫЙ БАННЕР (Hero) — меняй под свой фильм
    // ═══════════════════════════════════════════
    const heroConfig = {
      title: 'Бизнес-план «Биби»',
      subtitle: 'Рекомендуемое',
      ageRating: '0+',
      quality: 'HD',
      description: 'Энергичная кошечка Биби устраивается пекарем. В первый же день к ней приходят два кота и заказывают два пирога. Не устояв перед потрясающим ароматом, Биби прямо на глазах у обманутых клиентов съедает оба заказа сама.',
      poster: PHOTOS + 'cover1.png',
      video: VIDEOS + 'film1.mov',
      btnText: 'Смотреть'
    };

    // ═══════════════════════════════════════════
    // СЕКЦИИ — ДОБАВЛЯЙ/УДАЛЯЙ ФИЛЬМЫ ЗДЕСЬ
    // (ДОЛЖЕН БЫТЬ ИДЕНТИЧНЫМ index.html)
    // ═══════════════════════════════════════════
    // Каждый item = { id, title, video, poster, quality }
    // id: уникальный (film1, film2... ep1, ep2... bp1, work1...)
    // title: название на карточке
    // video: путь к файлу (VIDEOS + 'имя_файла')
    // poster: путь к обложке (PHOTOS + 'имя_файла') или '' если нет
    // quality: 'HD' / '4K' / '' — значок качества на карточке
    // ═══════════════════════════════════════════
    const sectionsConfig = [
      {
        id: 'movies',
        title: 'Фильмы',
        type: 'movies',
        items: [
          { id: 'film1', title: 'Бизнес-план «Биби»', video: VIDEOS + 'film1.mov', poster: PHOTOS + 'cover1.png', quality: 'HD' },
          { id: 'film2', title: 'Фильм 2', video: VIDEOS + 'film2.mov', poster: PHOTOS + 'cover2.png', quality: 'HD' },
          { id: 'film3', title: 'Фильм 3', video: VIDEOS + 'film3.mp4', poster: PHOTOS + 'cover3.png', quality: 'HD' },
          { id: 'film4', title: 'Фильм 4', video: VIDEOS + 'film4.mov', poster: PHOTOS + 'cover4.png', quality: 'HD' },
          { id: 'film5', title: 'Фильм 5', video: VIDEOS + 'film5.mov', poster: PHOTOS + 'cover5.png', quality: 'HD' },
          { id: 'film6', title: 'Фильм 6', video: VIDEOS + 'film6.mov', poster: PHOTOS + 'cover6.png', quality: 'HD' },
          { id: 'film7', title: 'Фильм 7', video: VIDEOS + 'film7.mp4', poster: PHOTOS + 'cover7.png', quality: 'HD' },
          { id: 'film8', title: 'Фильм 8', video: VIDEOS + 'film8.mp4', poster: PHOTOS + 'cover8.png', quality: 'HD' },
          { id: 'film9', title: 'Фильм 9', video: VIDEOS + 'film9.mp4', poster: PHOTOS + 'cover9.png', quality: 'HD' },
          { id: 'film10', title: 'Фильм 10', video: VIDEOS + 'film10.mp4', poster: PHOTOS + 'cover10.png', quality: 'HD' },
          { id: 'film11', title: 'Фильм 11', video: VIDEOS + 'film11.mp4', poster: PHOTOS + 'cover11.png', quality: 'HD' },
          // ДОБАВЛЯЙ НОВЫЕ ФИЛЬМЫ ВЫШЕ ЭТОЙ СТРОКИ:
          // { id: 'film12', title: 'Название', video: VIDEOS + 'film12.mov', poster: PHOTOS + 'cover12.png', quality: 'HD' },
        ]
      },
      {
        id: 'episodes',
        title: 'Эпизоды',
        type: 'episodes',
        items: [
          { id: 'ep1', title: 'Эпизод 1', video: VIDEOS + 'episode1.mov', poster: '' },
          { id: 'ep2', title: 'Эпизод 2', video: VIDEOS + 'episode2.mov', poster: '' },
          { id: 'ep2alt', title: 'Эпизод 2 (Альт. версия)', video: VIDEOS + 'episode2anotherv.mov', poster: '' },
          { id: 'ep3', title: 'Эпизод 3', video: VIDEOS + 'episode3.mov', poster: '' },
          { id: 'ep4', title: 'Эпизод 4', video: VIDEOS + 'episode4.mov', poster: '' },
          // ДОБАВЛЯЙ ЭПИЗОДЫ ВЫШЕ:
        ]
      },
      {
        id: 'badphones',
        title: 'Badphones',
        type: 'custom',
        items: [
          { id: 'bp1', title: 'Badphones 1', video: VIDEOS + 'badphone1.mp4', poster: PHOTOS + 'badcover1.png', quality: 'HD' },
          { id: 'bp2', title: 'Badphones 2', video: VIDEOS + 'badphone2.mp4', poster: PHOTOS + 'badcover2.png', quality: 'HD' },
          // ДОБАВЛЯЙ BADPHONES ВЫШЕ:
        ]
      },
      {
        id: 'work',
        title: 'Работа',
        type: 'custom',
        items: [
          { id: 'work1', title: 'Работа 1', video: VIDEOS + 'work1.mov', poster: PHOTOS + 'workcover1.png', quality: 'HD' },
          { id: 'work2', title: 'Работа 2', video: VIDEOS + 'work2.mov', poster: PHOTOS + 'workcover2.png', quality: 'HD' },
          // ДОБАВЛЯЙ РАБОТЫ ВЫШЕ:
        ]
      }
      // ХОЧЕШЬ НОВУЮ СЕКЦИЮ? КОПИРУЙ БЛОК ВЫШЕ И МЕНЯЙ id/title/items
    ];

    const videoTitles = {
      'assets/videos/film1.mov': 'Бизнес-план «Биби»',
      'assets/videos/film2.mov': 'Фильм 2',
      'assets/videos/film3.mp4': 'Фильм 3',
      'assets/videos/film4.mov': 'Фильм 4',
      'assets/videos/film5.mov': 'Фильм 5',
      'assets/videos/film6.mov': 'Фильм 6',
      'assets/videos/film7.mp4': 'Фильм 7',
      'assets/videos/film8.mp4': 'Фильм 8',
      'assets/videos/film9.mp4': 'Фильм 9',
      'assets/videos/film10.mp4': 'Фильм 10',
      'assets/videos/film11.mp4': 'Фильм 11',
      'assets/videos/episode1.mov': 'Эпизод 1',
      'assets/videos/episode2.mov': 'Эпизод 2',
      'assets/videos/episode2anotherv.mov': 'Эпизод 2 (Альт.)',
      'assets/videos/episode3.mov': 'Эпизод 3',
      'assets/videos/episode4.mov': 'Эпизод 4',
      'assets/videos/badphone1.mp4': 'Badphones 1',
      'assets/videos/badphone2.mp4': 'Badphones 2',
      'assets/videos/work1.mov': 'Работа 1',
      'assets/videos/work2.mov': 'Работа 2',
    };

    const playerConfig = {
      completionThreshold: 95,
      minWatchTime: 3,
      autoplay: true,
    };

    function getVideoTitle(videoSrc) {
      return videoTitles[videoSrc] || videoSrc.split('/').pop().replace(/\.[^.]+$/, '');
    }

    function formatTime(sec) {
      if (!sec || sec < 0) return '0:00';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return h > 0
        ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
        : `${m}:${String(s).padStart(2, '0')}`;
    }

    // Авто-генерация плоского массива всех видео
    const allVideos = sectionsConfig.flatMap(section =>
      section.items.map(item => ({
        ...item,
        sectionId: section.id,
        sectionTitle: section.title
      }))
    );

    // ==========================================
    // BiBiFilm — Profile App
    // ==========================================
    const STORAGE_KEY = 'video_watch_history';
    const FAVORITES_KEY = 'bibifilm_favorites';
    const USERS_KEY = 'bibifilm_users';

    // ----- INIT -----
    (function() {
      const currentUser = localStorage.getItem('bibifilm_current_user');
      if (!currentUser) {
        window.location.href = 'Register.html';
        return;
      }

      const nameEl = document.getElementById('userName');
      const handleEl = document.getElementById('userHandle');
      const avatarEl = document.getElementById('profileAvatar');
      const sidebarAvatar = document.getElementById('sidebarAvatar');

      if (nameEl) nameEl.textContent = currentUser;
      if (handleEl) handleEl.textContent = '@' + currentUser;
      if (avatarEl) avatarEl.textContent = currentUser.charAt(0).toUpperCase();
      if (sidebarAvatar) sidebarAvatar.textContent = currentUser.charAt(0).toUpperCase();

      // Member since
      const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
      if (users[currentUser]?.createdAt) {
        const year = new Date(users[currentUser].createdAt).getFullYear();
        document.getElementById('memberSince').textContent = year;
      }

      document.title = 'BiBiFilm — ' + currentUser;
      updateAuthNav();
      renderContinueWatching();
      renderFavorites(currentUser);
      renderStats(currentUser);
      enableRailScroll();
      observeRailScroll();
    })();

    // ----- AUTH NAV -----
    function updateAuthNav() {
      const authLink = document.getElementById('authNavLink');
      const logoutLink = document.getElementById('logoutNavLink');
      const currentUser = localStorage.getItem('bibifilm_current_user');

      if (currentUser) {
        if (authLink) { authLink.href = 'Profile.html'; authLink.title = 'Профиль (' + currentUser + ')'; }
        if (logoutLink) logoutLink.style.display = 'flex';
      } else {
        if (authLink) { authLink.href = 'Register.html'; authLink.title = 'Войти / Регистрация'; }
        if (logoutLink) logoutLink.style.display = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('bibifilm_current_user');
      window.location.href = 'Register.html';
    }

    // ----- RAIL SCROLL / NAV -----
    function enableRailScroll() {
      document.querySelectorAll('.rail').forEach(rail => {
        rail.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            rail.scrollLeft += e.deltaY * 1.5;
          }
        }, { passive: false });
      });
    }

    function scrollRail(railId, direction) {
      const rail = document.getElementById(railId);
      if (!rail) return;
      const cardWidth = 260 + 16;
      rail.scrollBy({ left: direction * cardWidth * 3, behavior: 'smooth' });
      setTimeout(() => updateRailNav(railId), 350);
    }

    function updateRailNav(railId) {
      const rail = document.getElementById(railId);
      if (!rail) return;
      const wrapper = rail.closest('.rail-wrapper');
      if (!wrapper) return;
      const prevBtn = wrapper.querySelector('.rail-nav--prev');
      const nextBtn = wrapper.querySelector('.rail-nav--next');
      if (prevBtn) prevBtn.style.display = rail.scrollLeft > 10 ? 'flex' : 'none';
      if (nextBtn) nextBtn.style.display = rail.scrollLeft + rail.clientWidth < rail.scrollWidth - 10 ? 'flex' : 'none';
    }

    function observeRailScroll() {
      document.querySelectorAll('.rail').forEach(rail => {
        rail.addEventListener('scroll', () => updateRailNav(rail.id));
      });
    }

    // ----- CONTINUE WATCHING -----
    function getWatchHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    function renderContinueWatching() {
      const history = getWatchHistory();
      const section = document.getElementById('continueSection');
      const rail = document.getElementById('continueRail');
      const items = Object.values(history).sort((a, b) => b.timestamp - a.timestamp);

      if (items.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      rail.innerHTML = items.slice(0, 10).map(item => {
        const hasPoster = !!item.posterSrc;
        const bgStyle = hasPoster ? `background-image: url('${item.posterSrc}');` : '';
        const placeholderClass = hasPoster ? '' : 'card__media--placeholder';
        const isCompleted = item.progress >= playerConfig.completionThreshold;
        const progressBar = !isCompleted
          ? `<div class="card__progress" style="width: ${item.progress}%;"></div>`
          : `<div class="card__progress card__progress--complete" style="width: 100%;"></div>`;
        const titleText = isCompleted ? 'Просмотрено' : `Продолжить с ${formatTime(item.currentTime)}`;

        return `
          <article class="rail__item card" role="listitem" data-video-src="${item.videoSrc}" onclick="openPlayer('${item.videoSrc}', '${item.posterSrc || ''}', ${item.currentTime})">
            <div class="card__media ${placeholderClass}" style="${bgStyle}">
              <button class="card__play-btn" aria-label="Смотреть" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
            ${progressBar}
            <div class="card__content">
              <h3 class="card__title">${titleText}</h3>
            </div>
          </article>
        `;
      }).join('');
      updateRailNav('continueRail');
    }

    // ----- FAVORITES (from allVideos + localStorage) -----
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || []; }
      catch { return []; }
    }

    function renderFavorites(user) {
      const favorites = getFavorites();
      const rail = document.getElementById('favoritesRail');

      if (favorites.length === 0) {
        rail.innerHTML = `
          <div class="rail__item" style="flex: 0 0 260px; display: flex;">
            <article class="card w-full" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 160px; text-align: center; border-style: dashed; border-color: var(--color-border);">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--color-text-dim); margin-bottom: var(--space-3);"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              <p style="color: var(--color-text-muted); font-size: var(--text-sm);">Пока ничего не сохранено</p>
              <p style="color: var(--color-text-dim); font-size: var(--text-xs); margin-top: var(--space-1);">Нажмите на сердечко у фильма, чтобы добавить сюда</p>
            </article>
          </div>
        `;
        return;
      }

      rail.innerHTML = favorites.map(videoSrc => {
        const video = allVideos.find(v => v.video === videoSrc);
        if (!video) return '';

        const hasPoster = !!video.poster;
        const bgStyle = hasPoster ? `background-image: url('${video.poster}');` : '';
        const placeholderClass = hasPoster ? '' : 'card__media--placeholder';

        return `
          <article class="rail__item card" role="listitem" data-video-src="${video.video}" onclick="openPlayer('${video.video}', '${video.poster || ''}')">
            <div class="card__media ${placeholderClass}" style="${bgStyle}">
              <button class="card__play-btn" aria-label="Смотреть" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
            <div class="card__content">
              <h3 class="card__title">${video.title}</h3>
              ${video.quality ? `<div class="card__meta"><span>${video.quality}</span></div>` : ''}
            </div>
          </article>
        `;
      }).filter(Boolean).join('');
      updateRailNav('favoritesRail');
    }

    // ----- STATS -----
    function renderStats(user) {
      const history = getWatchHistory();
      const userHistory = Object.values(history);
      const watched = new Set(userHistory.map(i => i.videoSrc)).size;
      const totalSec = userHistory.reduce((sum, i) => sum + (i.currentTime || 0), 0);
      const favorites = getFavorites();

      document.getElementById('statFilms').textContent = watched;
      document.getElementById('statTime').textContent = totalSec > 3600 ? `${Math.floor(totalSec/3600)} ч` : `${Math.floor(totalSec/60)} мин`;
      document.getElementById('statSaved').textContent = favorites.length;
    }

    // ----- MODAL (name/password) -----
    let modalMode = 'name';
    const modal = document.getElementById('actionModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalForm = document.getElementById('modalForm');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');
    const nameGroup = document.getElementById('modalNameGroup');
    const passGroup = document.getElementById('modalPassGroup');
    const newPassGroup = document.getElementById('modalNewPassGroup');
    const confirmPassGroup = document.getElementById('modalConfirmPassGroup');
    const nameInput = document.getElementById('modalNameInput');
    const currentPassInput = document.getElementById('modalCurrentPass');
    const newPassInput = document.getElementById('modalNewPass');
    const confirmPassInput = document.getElementById('modalConfirmPass');

    function openModal(mode) {
      modalMode = mode;
      modalForm.reset();
      clearModalValidation();

      if (mode === 'name') {
        modalTitle.textContent = 'Изменить имя';
        nameGroup.style.display = 'block';
        passGroup.style.display = 'none';
        newPassGroup.style.display = 'none';
        confirmPassGroup.style.display = 'none';
        modalSubmitBtn.textContent = 'Сохранить';
        const currentUser = localStorage.getItem('bibifilm_current_user');
        nameInput.value = currentUser || '';
      } else {
        modalTitle.textContent = 'Сменить пароль';
        nameGroup.style.display = 'none';
        passGroup.style.display = 'block';
        newPassGroup.style.display = 'block';
        confirmPassGroup.style.display = 'block';
        modalSubmitBtn.textContent = 'Сменить';
      }
      modal.classList.add('modal--open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('modal--open');
      document.body.style.overflow = '';
    }

    function changeName() { openModal('name'); }
    function changePassword() { openModal('password'); }

    function clearModalValidation() {
      [nameInput, currentPassInput, newPassInput, confirmPassInput].forEach(i => i.classList.remove('error', 'success'));
    }

    // Hash password
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + 'bibifilm_salt_2024');
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    modalForm.onsubmit = async (e) => {
      e.preventDefault();
      const currentUser = localStorage.getItem('bibifilm_current_user');
      if (!currentUser) return;

      if (modalMode === 'name') {
        const newName = nameInput.value.trim();
        if (!newName || newName.length < 2 || newName.length > 20) { nameInput.classList.add('error'); return; }
        if (!/^[a-zA-Z0-9а-яА-ЯёЁ_-]+$/.test(newName)) { nameInput.classList.add('error'); return; }

        const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
        if (users[newName] && newName !== currentUser) {
          nameInput.classList.add('error');
          showToast('Это имя уже занято', 'error');
          return;
        }

        users[newName] = { ...users[currentUser] };
        delete users[currentUser];
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
        localStorage.setItem('bibifilm_current_user', newName);

        document.getElementById('userName').textContent = newName;
        document.getElementById('userHandle').textContent = '@' + newName;
        document.getElementById('profileAvatar').textContent = newName.charAt(0).toUpperCase();
        document.getElementById('sidebarAvatar').textContent = newName.charAt(0).toUpperCase();
        document.title = 'BiBiFilm — ' + newName;

        showToast('Имя изменено', 'success');
        closeModal();
      } else {
        const currentPass = currentPassInput.value;
        const newPass = newPassInput.value;
        const confirmPass = confirmPassInput.value;

        if (!currentPass) { currentPassInput.classList.add('error'); return; }
        if (newPass.length < 4) { newPassInput.classList.add('error'); return; }
        if (newPass !== confirmPass) { confirmPassInput.classList.add('error'); showToast('Пароли не совпадают', 'error'); return; }

        const users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
        const hash = await hashPassword(currentPass);
        if (users[currentUser]?.passwordHash !== hash) {
          currentPassInput.classList.add('error');
          showToast('Неверный текущий пароль', 'error');
          return;
        }

        users[currentUser].passwordHash = await hashPassword(newPass);
        localStorage.setItem(USERS_KEY, JSON.stringify(users));

        showToast('Пароль изменён', 'success');
        closeModal();
      }
    };

    // ----- PLAYER -----
    const playerModal = document.getElementById('videoModal');
    const player = document.getElementById('mainPlayer');
    let currentMedia = null;

    function openPlayer(videoSrc, posterSrc, startTime = 0) {
      currentMedia = { videoSrc, posterSrc };
      player.src = videoSrc;
      if (posterSrc) player.poster = posterSrc;
      else player.removeAttribute('poster');

      playerModal.classList.add('modal--open');
      document.body.style.overflow = 'hidden';

      if (startTime > 0) player.currentTime = startTime;
      if (playerConfig.autoplay) player.play().catch(() => {});
    }

    player.addEventListener('timeupdate', () => {
      if (currentMedia && player.duration) {
        updateProgressBar(currentMedia.videoSrc, player.currentTime, player.duration);
      }
    });

    function saveProgress(videoSrc, posterSrc, currentTime, duration) {
      if (!duration || duration <= 0) return;
      const history = getWatchHistory();
      const progress = (currentTime / duration) * 100;
      if (progress > playerConfig.completionThreshold || currentTime < playerConfig.minWatchTime) {
        delete history[videoSrc];
      } else {
        history[videoSrc] = { videoSrc, posterSrc, currentTime, progress, timestamp: Date.now() };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      // Full re-render only on completion/close
      renderContinueWatching();
      renderStats(localStorage.getItem('bibifilm_current_user'));
    }

    // Lightweight progress bar update during playback (no re-render)
    function updateProgressBar(videoSrc, currentTime, duration) {
      const progress = (currentTime / duration) * 100;
      const card = document.querySelector(`#continueRail .card[data-video-src="${videoSrc}"]`);
      if (card) {
        const progressBar = card.querySelector('.card__progress');
        if (progressBar) {
          progressBar.style.width = `${Math.min(progress, 100)}%`;
          if (progress >= playerConfig.completionThreshold) {
            progressBar.classList.add('card__progress--complete');
          }
        }
        const title = card.querySelector('.card__title');
        if (title) {
          title.textContent = progress >= playerConfig.completionThreshold ? 'Просмотрено' : `Продолжить с ${formatTime(currentTime)}`;
        }
      }
    }

    function closePlayer() {
      if (currentMedia && player.duration) {
        saveProgress(currentMedia.videoSrc, currentMedia.posterSrc, player.currentTime, player.duration);
      }
      player.pause();
      player.src = '';
      currentMedia = null;
      playerModal.classList.remove('modal--open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (playerModal.classList.contains('modal--open')) closePlayer();
        if (modal.classList.contains('modal--open')) closeModal();
      }
    });

    // ----- TOAST -----
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast--${type === 'success' ? 'success' : type === 'error' ? 'error' : 'info'}`;
      const icons = {
        success: '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>',
        error: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>',
        info: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-4h2v4zm0-10h-2V7h2v6z"/>'
      };
      toast.innerHTML = `
        <svg class="toast__icon" viewBox="0 0 24 24">${icons[type === 'success' ? 'success' : type === 'error' ? 'error' : 'info']}</svg>
        <span class="toast__message">${message}</span>
        <button class="toast__close" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 19 17.59 13.41 12z"/></svg></button>
      `;
      toast.querySelector('.toast__close').onclick = () => toast.remove();
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }
  </script>
</body>
</html>
