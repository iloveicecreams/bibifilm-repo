<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiBiFilm — Вход / Регистрация</title>
  <link rel="icon" type="image/png" href="assets/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <main class="auth-page" role="main">
    <div class="auth-card">
      <header class="auth-header">
        <div class="auth-logo">
          <img src="assets/icons/icon.png" alt="" loading="lazy">
        </div>
        <h1 class="auth-title" id="authTitle">Создать аккаунт</h1>
        <p class="auth-subtitle" id="authSubtitle">Введите имя и пароль для входа</p>
      </header>

      <form class="auth-form" id="authForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Имя пользователя</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="Придумайте имя"
            autocomplete="username"
            required
            minlength="2"
            maxlength="20"
            pattern="^[a-zA-Z0-9а-яА-ЯёЁ_-]+$"
            aria-describedby="usernameHint"
          >
          <span class="form-hint" id="usernameHint">2–20 символов, буквы, цифры, _ -</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Минимум 4 символа"
              autocomplete="new-password"
              required
              minlength="4"
              maxlength="50"
              aria-describedby="passwordHint"
            >
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Показать пароль">
              <svg class="eye-open" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
            </button>
          </div>
          <span class="form-hint" id="passwordHint">Минимум 4 символа</span>
        </div>

        <div class="form-group" id="confirmGroup">
          <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            placeholder="Повторите пароль"
            autocomplete="new-password"
            required
            aria-describedby="confirmHint"
          >
          <span class="form-hint" id="confirmHint"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--lg w-full" id="authBtn">Создать аккаунт</button>
      </form>

      <div class="auth-switch">
        <span id="switchText">Уже есть аккаунт? </span>
        <a href="#" id="switchLink">Войти</a>
      </div>
    </div>
  </main>

  <script>
    // State: 'register' | 'login'
    let mode = 'register';

    const form = document.getElementById('authForm');
    const title = document.getElementById('authTitle');
    const subtitle = document.getElementById('authSubtitle');
    const btn = document.getElementById('authBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');
    const confirmGroup = document.getElementById('confirmGroup');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeOpen = passwordToggle.querySelector('.eye-open');
    const eyeClosed = passwordToggle.querySelector('.eye-closed');
    const passwordInput = document.getElementById('password');

    // Toast
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast--${type === 'success' ? 'success' : 'error'}`;
      const icons = {
        success: '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>',
        error: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>'
      };
      toast.innerHTML = `
        <svg class="toast__icon" viewBox="0 0 24 24">${icons[type === 'success' ? 'success' : 'error']}</svg>
        <span class="toast__message">${message}</span>
        <button class="toast__close" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 19 17.59 13.41 12z"/></svg></button>
      `;
      container.appendChild(toast);
      toast.querySelector('.toast__close').onclick = () => toast.remove();
      setTimeout(() => toast.remove(), 5000);
    }

    // Validation
    function validateUsername(value) {
      const hint = document.getElementById('usernameHint');
      const input = document.getElementById('username');

      if (!value) {
        input.classList.remove('success', 'error');
        hint.textContent = '2–20 символов, буквы, цифры, _ -';
        hint.className = 'form-hint';
        return false;
      }
      if (value.length < 2 || value.length > 20) {
        input.classList.add('error'); input.classList.remove('success');
        hint.textContent = 'Имя должно быть 2–20 символов';
        hint.className = 'form-hint form-hint--error';
        return false;
      }
      if (!/^[a-zA-Z0-9а-яА-ЯёЁ_-]+$/.test(value)) {
        input.classList.add('error'); input.classList.remove('success');
        hint.textContent = 'Только буквы, цифры, _ и -';
        hint.className = 'form-hint form-hint--error';
        return false;
      }
      input.classList.add('success'); input.classList.remove('error');
      hint.textContent = '✓ Имя доступно';
      hint.className = 'form-hint form-hint--success';
      return true;
    }

    function validatePassword(value) {
      const hint = document.getElementById('passwordHint');
      const input = document.getElementById('password');

      if (!value) {
        input.classList.remove('success', 'error');
        hint.textContent = 'Минимум 4 символа';
        hint.className = 'form-hint';
        return false;
      }
      if (value.length < 4) {
        input.classList.add('error'); input.classList.remove('success');
        hint.textContent = 'Пароль слишком короткий (мин. 4)';
        hint.className = 'form-hint form-hint--error';
        return false;
      }
      if (value.length > 50) {
        input.classList.add('error'); input.classList.remove('success');
        hint.textContent = 'Пароль слишком длинный (макс. 50)';
        hint.className = 'form-hint form-hint--error';
        return false;
      }
      input.classList.add('success'); input.classList.remove('error');
      hint.textContent = '✓ Пароль подходит';
      hint.className = 'form-hint form-hint--success';
      return true;
    }

    function validateConfirm(value) {
      const hint = document.getElementById('confirmHint');
      const input = document.getElementById('confirmPassword');
      const password = document.getElementById('password').value;

      if (!value) {
        input.classList.remove('success', 'error');
        hint.textContent = '';
        hint.className = 'form-hint';
        return false;
      }
      if (value !== password) {
        input.classList.add('error'); input.classList.remove('success');
        hint.textContent = 'Пароли не совпадают';
        hint.className = 'form-hint form-hint--error';
        return false;
      }
      input.classList.add('success'); input.classList.remove('error');
      hint.textContent = '✓ Пароли совпадают';
      hint.className = 'form-hint form-hint--success';
      return true;
    }

    // Switch mode
    function switchMode(newMode) {
      mode = newMode;
      if (mode === 'register') {
        title.textContent = 'Создать аккаунт';
        subtitle.textContent = 'Введите имя и пароль для входа';
        btn.textContent = 'Создать аккаунт';
        confirmGroup.style.display = 'block';
        switchText.textContent = 'Уже есть аккаунт? ';
        switchLink.textContent = 'Войти';
      } else {
        title.textContent = 'Войти';
        subtitle.textContent = 'Введите ваши данные';
        btn.textContent = 'Войти';
        confirmGroup.style.display = 'none';
        switchText.textContent = 'Нет аккаунта? ';
        switchLink.textContent = 'Зарегистрироваться';
      }
      form.reset();
      clearValidation();
    }

    function clearValidation() {
      document.querySelectorAll('.form-input').forEach(i => i.classList.remove('success', 'error'));
      document.querySelectorAll('.form-hint').forEach(h => {
        h.className = 'form-hint';
        if (h.id === 'usernameHint') h.textContent = '2–20 символов, буквы, цифры, _ -';
        else if (h.id === 'passwordHint') h.textContent = 'Минимум 4 символа';
        else if (h.id === 'confirmHint') h.textContent = '';
      });
    }

    // Password toggle
    passwordToggle.onclick = () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      eyeOpen.style.display = type === 'password' ? 'block' : 'none';
      eyeClosed.style.display = type === 'password' ? 'none' : 'block';
    };

    // Input events
    document.getElementById('username').addEventListener('input', e => validateUsername(e.target.value));
    document.getElementById('password').addEventListener('input', e => {
      validatePassword(e.target.value);
      if (mode === 'register') validateConfirm(document.getElementById('confirmPassword').value);
    });
    document.getElementById('confirmPassword').addEventListener('input', e => validateConfirm(e.target.value));

    // Switch link
    switchLink.onclick = (e) => {
      e.preventDefault();
      switchMode(mode === 'register' ? 'login' : 'register');
    };

    // Hash password
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + 'bibifilm_salt_2024');
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Save user
    function saveUser(username, passwordHash) {
      const users = JSON.parse(localStorage.getItem('bibifilm_users') || '{}');
      users[username] = { passwordHash, createdAt: Date.now() };
      localStorage.setItem('bibifilm_users', JSON.stringify(users));
    }

    // Check user
    async function checkUser(username, password) {
      const users = JSON.parse(localStorage.getItem('bibifilm_users') || '{}');
      const user = users[username];
      if (!user) return false;
      const hash = await hashPassword(password);
      return user.passwordHash === hash;
    }

    // Set current user
    function setCurrentUser(username) {
      localStorage.setItem('bibifilm_current_user', username);
    }

    // Form submit
    form.onsubmit = async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const validUsername = validateUsername(username);
      const validPassword = validatePassword(password);
      const validConfirm = mode === 'register' ? validateConfirm(document.getElementById('confirmPassword').value) : true;

      if (!validUsername || !validPassword || !validConfirm) return;

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        if (mode === 'register') {
          const users = JSON.parse(localStorage.getItem('bibifilm_users') || '{}');
          if (users[username]) {
            showToast('Это имя уже занято', 'error');
            return;
          }
          const hash = await hashPassword(password);
          saveUser(username, hash);
          setCurrentUser(username);
          showToast('Аккаунт создан! Перенаправление...', 'success');
        } else {
          const ok = await checkUser(username, password);
          if (!ok) {
            showToast('Неверное имя или пароль', 'error');
            return;
          }
          setCurrentUser(username);
          showToast('Успешный вход! Перенаправление...', 'success');
        }

        setTimeout(() => {
          window.location.href = 'Profile.html';
        }, 1200);

      } catch (err) {
        console.error(err);
        showToast('Ошибка. Попробуйте снова.', 'error');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    };

    // Initialize UI to match mode
    switchMode(mode);

    // Redirect if already logged in
    if (localStorage.getItem('bibifilm_current_user')) {
      window.location.href = 'Profile.html';
    }
  </script>
</body>
</html>
